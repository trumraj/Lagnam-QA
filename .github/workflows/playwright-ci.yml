name: Playwright Automation CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      tags:
        description: 'Cucumber tag expression to run (optional, overrides the default tags in RunnerTest)'
        required: false
        default: ''

permissions:
  contents: read

jobs:
  test:
    name: Run Playwright/Cucumber suite
    # Pinned (not ubuntu-latest): Playwright Java 1.45.0's "install --with-deps"
    # only recognizes the Ubuntu codenames that existed when it was released,
    # so it fails outright on newer ubuntu-latest images.
    runs-on: ubuntu-22.04
    timeout-minutes: 60

    env:
      # Wired up for the framework to consume if/when it's updated to read
      # credentials from the environment instead of the checked-in Excel
      # files. GitHub automatically redacts these values from logs.
      APP_LOGIN_URL: ${{ secrets.APP_LOGIN_URL }}
      APP_USERNAME: ${{ secrets.APP_USERNAME }}
      APP_PASSWORD: ${{ secrets.APP_PASSWORD }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '11'
          cache: maven

      - name: Install Xvfb (framework launches Chromium in headed mode)
        run: sudo apt-get update && sudo apt-get install -y xvfb

      - name: Install Playwright browser binaries
        run: mvn -B exec:java -Dexec.mainClass=com.microsoft.playwright.CLI -Dexec.args="install --with-deps chromium"

      - name: Run automation suite
        id: run_tests
        run: |
          if [ -n "${{ inputs.tags }}" ]; then
            xvfb-run -a mvn -B clean test "-Dcucumber.filter.tags=${{ inputs.tags }}"
          else
            xvfb-run -a mvn -B clean test
          fi

      - name: Generate Allure HTML report
        if: always()
        run: mvn -B allure:report
        continue-on-error: true

      - name: Upload Allure HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-report
          path: target/site/allure-maven-plugin
          retention-days: 14
          if-no-files-found: ignore

      - name: Upload Allure raw results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results
          path: target/allure-results
          retention-days: 14
          if-no-files-found: ignore

      - name: Upload Cucumber HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cucumber-report
          path: target/cucumber-report.html
          retention-days: 14
          if-no-files-found: ignore

      - name: Upload Extent report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: extent-report
          path: test-output/
          retention-days: 14
          if-no-files-found: ignore

      - name: Upload screenshots and videos (failure evidence)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: failure-evidence
          path: |
            target/screenshots/
            target/videos/
          retention-days: 14
          if-no-files-found: ignore

      - name: Upload Surefire test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: target/surefire-reports/
          retention-days: 14
          if-no-files-found: ignore
